packages:
  - apps/*

allowBuilds:
  "@nestjs/core": true
  "@parcel/watcher": true
  "@swc/core": true
  bcrypt: true
  esbuild: true
  lefthook: true
  unrs-resolver: true
  vue-demi: true

catalog:
  typescript: ^5.9.3
  "@types/node": ^25.9.4

minimumReleaseAgeExclude:
  - "@nuxt/kit@4.5.0"
  - "@nuxt/nitro-server@4.5.0"
  - "@nuxt/schema@4.5.0"
  - "@nuxt/vite-builder@4.5.0"
  - nuxt@4.5.0
