name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Filter paths
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            quality:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.nvmrc'
              - '.npmrc'
              - 'lefthook.yml'
              - 'scripts/**'
              - 'docker-compose.local.yml'
              - '.github/workflows/**'
            backend:
              - 'apps/back/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.github/workflows/**'
            frontend:
              - 'apps/front/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.github/workflows/**'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.github/workflows/**'

  quality:
    name: Lint and format
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.quality == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Version comes from package.json "packageManager" (do not pin here).
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm exec oxlint scripts
          pnpm run lint

      - name: Format check
        run: |
          pnpm exec oxfmt --check scripts
          pnpm run fmt:check

  backend:
    name: Backend tests and coverage
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm --filter back typecheck
          pnpm --filter back typecheck:tests
          pnpm --filter @sarpbc/utils test

      - name: Migration names
        run: pnpm --filter back test:migrations
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}

      - name: Architecture and HTTP contracts
        run: |
          pnpm --filter back test:architecture
          pnpm --filter back test:contracts

      - name: Unit, e2e and integration tests (PostgreSQL/Redis, migrations) with coverage
        run: pnpm --filter back test:cov
        env:
          PANDASCORE_API_TOKEN: test-token
          JWT_KEY: test-jwt-key
          FRONT_URL: http://localhost:4000
          ADMIN_URL: http://localhost:4002

  frontend:
    name: Frontend typecheck and build
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter front run typecheck

      - name: Build
        run: pnpm --filter front run build
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192

  admin:
    name: Admin typecheck and build
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.admin == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter admin run typecheck

      - name: Build
        run: pnpm --filter admin run build
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192

  ci:
    name: CI
    needs: [changes, quality, backend, frontend, admin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          check() {
            case "$2" in
              success) ;;
              skipped)
                if [ "$EVENT_NAME" = "push" ] && [ "$1" != "changes" ]; then
                  echo "Job $1 was skipped on push, every job must run on main."
                  exit 1
                fi
                ;;
              *)
                echo "Job $1 finished with status: $2"
                exit 1
                ;;
            esac
          }

          check changes "${{ needs.changes.result }}"
          check quality "${{ needs.quality.result }}"
          check backend "${{ needs.backend.result }}"
          check frontend "${{ needs.frontend.result }}"
          check admin "${{ needs.admin.result }}"

          if [ "$EVENT_NAME" = "push" ]; then
            echo "All jobs succeeded."
          else
            echo "All executed jobs succeeded (path-skipped jobs ignored)."
          fi
