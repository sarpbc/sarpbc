name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Filter paths
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            quality:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - '.nvmrc'
              - '.npmrc'
              - 'scripts/**'
              - 'tools/**'
              - 'docs/**'
              - '.github/workflows/**'
            backend:
              - 'apps/back/**'
              - '.dockerignore'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.npmrc'
              - '.github/workflows/**'
            frontend:
              - 'apps/front/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.npmrc'
              - '.github/workflows/**'
            admin:
              - 'apps/admin/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.nvmrc'
              - '.npmrc'
              - '.github/workflows/**'

  quality:
    name: Lint and format
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.quality == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Version comes from package.json "packageManager" (do not pin here).
      - uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run fmt:check

      - name: Dockerfile Node version
        run: pnpm check:node

      - name: Typecheck packages
        run: pnpm exec turbo run typecheck --filter="./packages/*"

      - name: Typecheck scripts
        run: pnpm typecheck:scripts

      - name: Stream score OCR tool
        run: |
          pnpm --filter @sarpbc/stream-score-ocr typecheck
          pnpm --filter @sarpbc/stream-score-ocr test

      - name: Locale parity and package boundaries
        run: |
          pnpm check:i18n
          pnpm check:packages
          pnpm test:checks

  backend:
    name: Backend tests and coverage
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: |
          pnpm --filter back typecheck
          pnpm --filter back typecheck:tests

      - name: Utils tests
        run: pnpm --filter @sarpbc/utils test

      - name: Migration names
        run: pnpm --filter back test:migrations
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || '' }}

      - name: Architecture and HTTP contracts
        run: |
          pnpm --filter back test:architecture
          pnpm --filter back test:contracts

      - name: Unit, e2e and integration tests (PostgreSQL/Redis, migrations) with coverage
        run: pnpm --filter back test:cov
        env:
          PANDASCORE_API_TOKEN: test-token
          JWT_KEY: test-jwt-key
          FRONT_URL: http://localhost:4000
          ADMIN_URL: http://localhost:4002

  back-image:
    name: Boot back image
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_USER: sarpbc
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sarpbc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sarpbc -d sarpbc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/back/Dockerfile
          load: true
          push: false
          tags: sarpbc-back:boot

      - name: Start container
        run: |
          docker run -d --name back --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_USER=sarpbc \
            -e DB_PASSWORD=password \
            -e DB_NAME=sarpbc \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e PORT=4001 \
            -e JWT_KEY=boot-check-only-secret-key-0123456789abcdef \
            -e FRONT_URL=https://sarpbc.org \
            -e ADMIN_URL=https://admin.sarpbc.org \
            -e PANDASCORE_API_TOKEN=boot-check \
            -e PANDASCORE_SYNC_ON_BOOT=false \
            -e GOOGLE_CLIENT_ID=boot-check \
            -e GOOGLE_CLIENT_SECRET=boot-check \
            -e GOOGLE_REDIRECT_URI=https://sarpbc.org/auth/google/callback \
            sarpbc-back:boot

      - name: Wait until ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4001/health/ready; then
              echo "Ready after attempt $attempt."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' back)" != "true" ]; then
              echo "The container stopped before it was ready."
              exit 1
            fi
            sleep 2
          done
          echo "The container was not ready in time."
          exit 1

      - name: Container logs
        if: always()
        run: docker logs back

  frontend:
    name: Frontend typecheck and build
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter front run typecheck

      - name: Build
        run: pnpm --filter front run build
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192

  admin:
    name: Admin typecheck and build
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.admin == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter admin run typecheck

      - name: Build
        run: pnpm --filter admin run build
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=8192

  ci:
    name: CI
    needs: [changes, quality, backend, back-image, frontend, admin]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          check() {
            case "$2" in
              success) ;;
              skipped)
                if [ "$EVENT_NAME" = "push" ] && [ "$1" != "changes" ]; then
                  echo "Job $1 was skipped on push, every job must run on main."
                  exit 1
                fi
                ;;
              *)
                echo "Job $1 finished with status: $2"
                exit 1
                ;;
            esac
          }

          check changes "${{ needs.changes.result }}"
          check quality "${{ needs.quality.result }}"
          check backend "${{ needs.backend.result }}"
          check back-image "${{ needs.back-image.result }}"
          check frontend "${{ needs.frontend.result }}"
          check admin "${{ needs.admin.result }}"

          if [ "$EVENT_NAME" = "push" ]; then
            echo "All jobs succeeded."
          else
            echo "All executed jobs succeeded (path-skipped jobs ignored)."
          fi
