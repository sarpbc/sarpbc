name: Back image

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/back/**"
      - "packages/types/**"
      - "packages/utils/**"
      - ".dockerignore"
      - ".npmrc"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/back-image.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  boot:
    name: Boot back image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_USER: sarpbc
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sarpbc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sarpbc -d sarpbc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/back/Dockerfile
          load: true
          push: false
          tags: sarpbc-back:boot

      - name: Start container
        run: |
          docker run -d --name back --network host \
            -e DB_HOST=localhost \
            -e DB_PORT=5432 \
            -e DB_USER=sarpbc \
            -e DB_PASSWORD=password \
            -e DB_NAME=sarpbc \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e PORT=4001 \
            -e JWT_KEY=boot-check-only-secret-key-0123456789abcdef \
            -e FRONT_URL=https://sarpbc.org \
            -e ADMIN_URL=https://admin.sarpbc.org \
            -e PANDASCORE_API_TOKEN=boot-check \
            -e PANDASCORE_SYNC_ON_BOOT=false \
            -e GOOGLE_CLIENT_ID=boot-check \
            -e GOOGLE_CLIENT_SECRET=boot-check \
            -e GOOGLE_REDIRECT_URI=https://sarpbc.org/auth/google/callback \
            sarpbc-back:boot

      - name: Wait until ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:4001/health/ready; then
              echo "Ready after attempt $attempt."
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' back)" != "true" ]; then
              echo "The container stopped before it was ready."
              exit 1
            fi
            sleep 2
          done
          echo "The container was not ready in time."
          exit 1

      - name: Container logs
        if: always()
        run: docker logs back
