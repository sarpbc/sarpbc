version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    pull-request-branch-name:
      prefix: chore
      template: "chore/{name}"
    ignore:
      # TypeScript 7 drops the JS API that vue-tsc, apps/back/scripts/check-architecture.mjs and
      # check-http-contract.mjs use, and the deprecated options in apps/back/tsconfig.json
      # (moduleResolution node, ignoreDeprecations).
      - dependency-name: typescript
        versions: [">=7"]
    groups:
      npm-updates:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
    pull-request-branch-name:
      prefix: ci
      template: "ci/{name}"
    groups:
      github-actions:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      github-actions-major:
        update-types:
          - major
        patterns:
          - "*"
